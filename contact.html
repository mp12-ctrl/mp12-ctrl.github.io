<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us – Resume Maker</title>
<meta name="description" content="Contact Resume Maker for support, feedback and queries. We are here to help you.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>
<style> /* ===============================
   PREMIUM CONTACT PAGE
   =============================== */

/* BACKGROUND */
.contact-bg {
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);
  background-size: 400% 400%;
  animation: bgAnimate 12s ease infinite;
}

@keyframes bgAnimate {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* PREMIUM CONTAINER */
.contact-premium {
  margin-top: 60px;
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.88);
  border-radius: 20px;
  position: relative;
}

/* ANIMATED BORDER */
.contact-premium::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 22px;
  background: linear-gradient(
    120deg,
    #00c6ff,
    #7f00ff,
    #ff758c,
    #00c6ff
  );
  background-size: 300% 300%;
  animation: borderFlow 7s linear infinite;
  z-index: -1;
}

/* GRID */
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-top: 30px;
}

/* FORM BOX */
.contact-form-box input,
.contact-form-box textarea {
  width: 100%;
  margin-bottom: 15px;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid #ddd;
  transition: all 0.3s ease;
}

.contact-form-box input:focus,
.contact-form-box textarea:focus {
  border-color: #7f00ff;
  box-shadow: 0 0 12px rgba(127,0,255,0.4);
  outline: none;
}

.contact-form-box button {
  width: 100%;
  padding: 14px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}

.contact-form-box button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* INFO CARDS */
.info-card {
  background: #fff;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 15px;
  transition: all 0.35s ease;
  border: 2px solid #eee;
}

.info-card:hover {
  border-color: #00c6ff;
  box-shadow: 0 0 18px rgba(0,198,255,0.4);
  transform: translateY(-4px);
}

/* MOBILE */
@media (max-width: 768px) {
  .contact-grid {
    grid-template-columns: 1fr;
  }
  }
</style>
<body class="contact-bg">

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="resume-tips.html">Resume Tips</a>
  <a href="fresher-resume-format.html">Fresher Resume</a>
</nav>

<div class="container contact-premium">

<h1>Get in Touch</h1>
<p class="subtitle">
We’d love to hear from you.  
Send us your message and we’ll respond soon.
</p>

<div class="contact-grid">

  <!-- CONTACT FORM -->
  <div class="contact-form-box">
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- INFO CARDS -->
  <div class="contact-info-box">

    <div class="info-card">
      <h3>📧 Email</h3>
      <p>support@resumemaker.com</p>
    </div>

    <div class="info-card">
      <h3>📞 Support</h3>
      <p>Available 24/7 Online</p>
    </div>

    <div class="info-card">
      <h3>📍 Location</h3>
      <p>India</p>
    </div>

  </div>

</div>

</div>

</body>
                   </html>
