   <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Maker</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
body{
  background:#eef2f5;
  font-family:Poppins, sans-serif;
  padding:15px;
}
h1,h2{text-align:center}

.template-box{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}
.template{
  background:#fff;
  padding:15px;
  width:200px;
  text-align:center;
  border-radius:8px;
  box-shadow:0 3px 8px #aaa;
}

button{
  background:#007bff;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:5px;
  cursor:pointer;
}

.form-box,.preview{
  background:#fff;
  max-width:850px;
  margin:20px auto;
  padding:15px;
  border-radius:8px;
  box-shadow:0 3px 10px #aaa;
}

input,select,textarea{
  width:100%;
  padding:7px;
  margin:6px 0;
}

.preview{display:none}

/* ===== TEMPLATE DESIGNS ===== */
.template1{font-family:Roboto;background:#fdfefe}
.template1 .header{background:#007bff;color:#fff;padding:10px}

.template2{font-family:Playfair Display;background:#fff7ed}
.template2 .header{background:#ff9800;color:#fff;padding:10px}

.template3{font-family:Poppins;background:#f3f4f6}
.template3 .header{background:#4caf50;color:#fff;padding:10px}

img{width:110px;border-radius:50%}
.icon{font-weight:bold}
</style>
</head>

<body>

<h1>Select Resume Template</h1>

<div class="template-box">
  <div class="template"><b>Classic</b><br><button onclick="selectTemplate('template1')">Use Template</button></div>
  <div class="template"><b>Creative</b><br><button onclick="selectTemplate('template2')">Use Template</button></div>
  <div class="template"><b>Professional</b><br><button onclick="selectTemplate('template3')">Use Template</button></div>
</div>

<!-- FORM -->
<div class="form-box" id="form" style="display:none">
<h2>Create Resume</h2>

<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email *" required>
<input id="phone" type="tel" placeholder="Phone *" required>

<select id="gender">
  <option value="">Gender</option>
  <option>Male</option>
  <option>Female</option>
</select>

<select id="marital">
  <option value="">Marital Status</option>
  <option>Single</option>
  <option>Married</option>
</select>

<input type="date" id="dob">
<input id="father" placeholder="Father Name">
<input id="nation" placeholder="Nationality">
<textarea id="address" placeholder="Address"></textarea>

<b>Career Objective</b>
<select onchange="fillObjective(this.value)">
  <option value="">Select common objective</option>
  <option>To work in a growth oriented organization.</option>
  <option>Seeking a challenging position to enhance my skills.</option>
  <option>To build a professional career with dedication.</option>
</select>
<textarea id="objective" placeholder="Or write your own objective"></textarea>

<b>Skills</b>
<select onchange="addSkill(this.value)">
  <option value="">Select common skill</option>
  <option>HTML</option>
  <option>CSS</option>
  <option>JavaScript</option>
  <option>MS Word</option>
  <option>Communication</option>
</select>
<input id="customSkill" placeholder="Add more skills (optional)">

<b>Qualification</b>
<input id="course" placeholder="Course / Degree">
<input id="board" placeholder="Board / University">
<input id="year" placeholder="Year of Passing">
<input id="percent" placeholder="Percentage">

<textarea id="experience" placeholder="Experience (optional)"></textarea>

<b>Upload Photo</b>
<input type="file" accept="image/*" onchange="loadPhoto(event)">

<button type="button" onclick="previewResume()">Preview Resume</button>
</div>

<!-- PREVIEW -->
<div class="preview" id="preview">
  <div class="header">
    <h2 id="pname"></h2>
  </div>

  <img id="pimg"><br><br>

  📧 <span id="pemail"></span><br>
  📞 <span id="pphone"></span><br>
  📍 <span id="paddress"></span>

  <hr>
  <b>Objective</b>
  <p id="pobjective"></p>

  <b>Skills</b>
  <p id="pskills"></p>

  <b>Qualification</b>
  <p id="pqual"></p>

  <b>Experience</b>
  <p id="pexp"></p>

  <button onclick="downloadPDF()">Download PDF</button>
  <button onclick="shareResume()">Share</button>
</div>

<script>
let templateClass="template1";
let skills=[];

function selectTemplate(t){
  templateClass=t;
  document.getElementById("form").style.display="block";
  window.scrollTo(0,document.body.scrollHeight);
}

function fillObjective(val){
  document.getElementById("objective").value=val;
}

function addSkill(val){
  if(val && !skills.includes(val)) skills.push(val);
}

function loadPhoto(e){
  document.getElementById("pimg").src=URL.createObjectObjectURL
    ? URL.createObjectObjectURL(e.target.files[0])
    : URL.createObjectURL(e.target.files[0]);
}

function previewResume(){
  let p=document.getElementById("preview");
  p.className="preview "+templateClass;

  document.getElementById("pname").innerText=name.value;
  document.getElementById("pemail").innerText=email.value;
  document.getElementById("pphone").innerText=phone.value;
  document.getElementById("paddress").innerText=address.value;
  document.getElementById("pobjective").innerText=objective.value;
  document.getElementById("pskills").innerText=skills.join(", ")+" "+customSkill.value;
  document.getElementById("pqual").innerText=
    course.value+" | "+board.value+" | "+year.value+" | "+percent.value;
  document.getElementById("pexp").innerText=experience.value;

  p.style.display="block";
  window.scrollTo(0,document.body.scrollHeight);
}

function downloadPDF(){
  window.print();
}

function shareResume(){
  if(navigator.share){
    navigator.share({
      title:"My Resume",
      text:"Resume created using Resume Maker"
    });
  }else{
    alert("Share not supported on this browser");
  }
}
</script>

</body>
  </html>
