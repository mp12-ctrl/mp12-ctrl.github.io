<script>
const phone=document.getElementById("phone");
const email=document.getElementById("email");
const dob=document.getElementById("dob");
const photo=document.getElementById("photo");
const skills=document.getElementById("skills");
const eduForm=document.getElementById("eduForm");
const eduPreview=document.getElementById("eduPreview");

function setText(id,v){document.getElementById(id).innerText=v||""}

function setDOB(v){
 if(!v){dob.innerText="";return}
 let d=new Date(v);
 dob.innerText=d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})
}

function validatePhone(i){
 phone.innerText=i.value;
 phoneTick.style.display=/^[0-9]{10}$/.test(i.value)?"inline":"none"
}
function validateEmail(i){
 email.innerText=i.value;
 emailTick.style.display=/^\S+@\S+\.\S+$/.test(i.value)?"inline":"none"
}

function loadImg(e){
 let r=new FileReader();
 r.onload=()=>{photo.src=r.result;photo.classList.remove("hide")}
 r.readAsDataURL(e.target.files[0])
}

let skillsArr=[];
function addSkill(){
 let v=skillSelect.value.trim();
 if(v && !skillsArr.includes(v)){
  skillsArr.push(v);
  skills.innerHTML=skillsArr.map(s=>"<li>"+s+"</li>").join("");
 }
}

let edu=[];
function addEdu(){
 let i=edu.length;edu.push({});
 let d=document.createElement("div");
 d.innerHTML=`
 <input placeholder="Qualification" oninput="setEdu(${i},'q',this.value)">
 <input placeholder="Board" oninput="setEdu(${i},'b',this.value)">
 <input placeholder="Year" oninput="setEdu(${i},'y',this.value)">
 <input placeholder="%" oninput="setEdu(${i},'p',this.value)">
 <hr>`;
 eduForm.appendChild(d);
}
function setEdu(i,k,v){edu[i][k]=v;renderEdu()}
function renderEdu(){
 eduPreview.innerHTML="";
 edu.forEach(e=>{
  if(e.q){
   eduPreview.innerHTML+=
   `<tr><td>${e.q}</td><td>${e.b||""}</td><td>${e.y||""}</td><td>${e.p||""}</td></tr>`;
  }
 });
}

function downloadPDF(){
 html2pdf().from(resume).set({
  filename:'Resume.pdf',
  jsPDF:{format:'a4',orientation:'portrait'}
 }).save();
}

function downloadImage(){
 html2canvas(resume,{scale:2}).then(c=>{
  let a=document.createElement("a");
  a.download="Resume.png";
  a.href=c.toDataURL();
  a.click();
 });
}

async function shareResume(){
 const pdf=await html2pdf().from(resume).output('blob');
 const file=new File([pdf],"Resume.pdf",{type:"application/pdf"});
 if(navigator.share){
  navigator.share({files:[file],title:"My Resume"});
 }else{
  alert("Share not supported");
 }
}
</script>
